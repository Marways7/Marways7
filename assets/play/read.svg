@keyframes trace{to{stroke-dashoffset:-1180}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.drift,.trace,.turn,.blink{animation:none!important}}
