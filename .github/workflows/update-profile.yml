name: Refresh public profile artwork

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_shape_profile.py'
      - 'scripts/build_cinema_profile.py'
      - 'scripts/build_living_profile.py'
      - 'scripts/refresh_public_data.py'
      - 'scripts/validate_shape_profile.py'
      - 'assets/fonts/Sora.ttf'
      - 'requirements-profile.txt'
      - '.github/workflows/update-profile.yml'

concurrency:
  group: main-branch-auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-profile.txt
      - name: Read public repository metadata
        run: python scripts/refresh_public_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and validate profile artwork
        run: |
          python scripts/build_shape_profile.py
          python scripts/build_cinema_profile.py
          python scripts/build_living_profile.py
          python scripts/validate_shape_profile.py
      - name: Publish refreshed artwork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shape data/public-profile.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh public profile snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
